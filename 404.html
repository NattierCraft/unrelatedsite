    <script crossorigin="anonymous" integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA==" referrerpolicy="no-referrer" src="./room_dogcheck_files/howler.min.js"></script>

    <div id="center">
<div class="dog playing" id="dog_sleep">
<img alt="Sleeping dog" class="dog1" src="assets/404/dog-sleep.png" style="opacity: 0;">
<img alt="Sleeping dog" class="dog2" src="assets/404/dog-sleep.gif" style="opacity: 1;">
</div>
<div class="dog hidden playing" id="dog_maraca">
<img alt="Maraca dog" class="dog1" src="assets/404/dog-maraca.png" style="opacity: 0;">
<img alt="Maraca dog" class="dog2" src="assets/404/dog-maraca.gif" style="opacity: 1;">
</div>
</div>
<style>
  .dog {
    min-width: 320px;
    max-width: 100%;
    min-height: 320px;
    max-height: 100%;
    position: relative;
    color: black;
    cursor: pointer;
  }
  .dog img {
    position: absolute;
    height: 100%;
    width: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .dog2 {
    opacity: 0;
  }
</style>
<script>
  var maraca = false;
  
  var results = new Howl({
    src="assets/audio/results.mp3",
    volume: 0.5,
    loop: true
  });
  
  var baci = new Howl({
    src="assets/audio/baci_perugina2.mp3",
    volume: 0.5,
    loop: true
  });
  
  $(function() {
    var r = Math.random();
    if (Math.random() >= 0.95) {
      $('#dog_sleep').addClass('hidden');
      $('#dog_maraca').removeClass('hidden');
      maraca = true;
    }
  });
  
  $(document).on('click', '.dog:not(.playing)', function() {
    if (maraca) {
      baci.play();
    } else {
      results.play();
    }
    $('.dog').addClass('playing');
    $('.dog1').css('opacity', 0);
    $('.dog2').css('opacity', 1);
  });
  
  $(document).on('click', '.dog.playing', function() {
    if (maraca) {
      baci.pause();
    } else {
      results.pause();
    }
    $('.dog').removeClass('playing');
    $('.dog1').css('opacity', 1);
    $('.dog2').css('opacity', 0);
  });
</script>
